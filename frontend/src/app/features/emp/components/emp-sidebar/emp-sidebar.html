<aside class="sidebar bg-dark-theme" [class.collapsed]="!(isEmpSidebarOpen$ | async)">
  <!-- Sidebar Top Brand Header -->
  <div class="sidebar-brand-header">
    <div class="brand-logo-wrap">
      <img src="assets/Logo.png" alt="AIVAN 360 SOLUTIONS" class="sidebar-brand-logo" />
    </div>
    <div class="brand-title-wrap">
      <span class="brand-company-name">AIVAN 360</span>
      <span class="brand-sub">SOLUTIONS</span>
    </div>
  </div>

  <div class="sidebar-inner menu-container scroll-enabled">
    <ng-container *ngFor="let group of menuConfig">
      <div class="menu-group">
        <h5 class="group-title" *ngIf="group.groupName">
          <span class="title-text">{{ group.groupName }}</span>
          <span class="collapsed-divider"></span>
        </h5>
        
        <ul class="menu-list">
          <li *ngFor="let item of group.items" class="menu-item-wrapper">
            
            <!-- Menu Item (Standard Link, Dropdown Trigger, or Logout) -->
            <a [routerLink]="item.children || item.isLogout ? null : item.route" 
               (click)="handleItemClick(item, $event)"
               [routerLinkActive]="item.children || item.isLogout ? '' : 'active'" 
               [routerLinkActiveOptions]="{exact: item.route === '/emp-dashboard'}"
               [class.active-parent]="isParentActive(item)"
               [class.expanded]="item.expanded"
               [class.has-dropdown]="!!item.children"
               class="menu-link hover-effect"> 
              <i [class]="item.icon + ' fa-fw menu-icon'"></i>
              <span class="menu-text">{{ item.label }}</span>
              <span class="menu-arrow" *ngIf="item.children">
                <i class="fas fa-angle-right" [class.rotated]="item.expanded"></i>
              </span>
            </a>

            <!-- Sub Menu for dropdown items -->
            <ul class="sub-menu" *ngIf="item.children && item.expanded">
              <li *ngFor="let child of item.children" class="sub-menu-item">
                
                <!-- Leaf Child Item (direct route) -->
                <a *ngIf="!child.children"
                   [routerLink]="child.route" 
                   (click)="checkMobileCollapse()"
                   routerLinkActive="active" 
                   [routerLinkActiveOptions]="{exact: false}"
                   class="sub-menu-link">
                  <i [class]="child.icon + ' fa-fw sub-menu-icon'" *ngIf="child.icon"></i>
                  <span class="sub-menu-text">{{ child.label }}</span>
                </a>

                <!-- Branch Child Item with Sub-Parts (e.g. Trainings, Payroll) -->
                <ng-container *ngIf="child.children">
                  <a (click)="toggleChildExpand(child, $event)"
                     [class.expanded]="child.expanded"
                     [class.active-parent]="isParentActive(child)"
                     class="sub-menu-link has-nested-dropdown"
                     style="cursor: pointer;">
                    <i [class]="child.icon + ' fa-fw sub-menu-icon'" *ngIf="child.icon"></i>
                    <span class="sub-menu-text">{{ child.label }}</span>
                    <span class="menu-arrow">
                      <i class="fas fa-angle-right" [class.rotated]="child.expanded"></i>
                    </span>
                  </a>

                  <!-- Level 2 Nested Sub Menu -->
                  <ul class="nested-sub-menu" *ngIf="child.expanded">
                    <li *ngFor="let subChild of child.children" class="nested-sub-menu-item">
                      <a [routerLink]="subChild.route"
                         (click)="checkMobileCollapse()"
                         routerLinkActive="active"
                         [routerLinkActiveOptions]="{exact: false}"
                         class="nested-sub-menu-link">
                        <i [class]="subChild.icon + ' fa-fw nested-icon'" *ngIf="subChild.icon"></i>
                        <span class="nested-sub-menu-text">{{ subChild.label }}</span>
                      </a>
                    </li>
                  </ul>
                </ng-container>

              </li>
            </ul>

          </li>
        </ul>
      </div>
    </ng-container>
  </div>

  <!-- Sidebar Bottom Card -->
  <div class="sidebar-bottom-card" *ngIf="(isEmpSidebarOpen$ | async)">
    <div class="bottom-card-inner">
      <span class="bottom-brand-badge">360 HR+</span>
      <p class="bottom-brand-sub">Complete HR Management</p>
    </div>
  </div>
</aside>

<div class="logout-popup" *ngIf="isLogoutPopupOpen">
  <div class="popup-box">
    <p>Are you sure you want to logout?</p>

    <div class="actions">
      <button class="yes-btn" (click)="confirmLogout()">Yes</button>
      <button class="no-btn" (click)="closeLogoutPopup()">No</button>
    </div>
  </div>
</div>
