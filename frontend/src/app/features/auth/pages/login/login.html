<div class="login-container">
  <!-- LEFT SIDE -->
  <div class="login-card-wrapper">
    <div class="login-card">
      <div class="logo-area">
        <img src="assets/AivanLogo.png" alt="AIVAN Logo" class="logo-img" />
        <h2 class="company-name">AIVAN ERP</h2>
        <p class="login-subtitle">LOGIN</p>
      </div>


      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="emailInput">Username</label>
          <input type="email" id="emailInput" name="email" formControlName="email" placeholder="username@gmail.com" />

          <small *ngIf="f['email'].touched && f['email'].errors">
            <span *ngIf="f['email'].errors['required']">Email is required</span>
            <span *ngIf="f['email'].errors['email']">Invalid email format</span>
          </small>
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" name="password" formControlName="password" placeholder="********" />

          <small *ngIf="f['password'].touched && f['password'].errors">
            <span *ngIf="f['password'].errors['required']">Password is required</span>
            <span *ngIf="f['password'].errors['minlength']">
              Password must be at least 6 characters
            </span>
          </small>
        </div>

        <div class="remember">
          <input type="checkbox" id="rememberMe" />
          <label for="rememberMe">Remember Me</label>
          <a routerLink="/auth/forgot-password" class="link-text">
            Forgot Password
          </a>
        </div>

        <button type="submit" class="login-btn" [disabled]="loginForm.invalid">Login</button>
      </form>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="login-image">
    <img src="assets/login-bg.png" alt="login illustration" />
  </div>
</div>

<!-- CENTER POPUP -->
<div *ngIf="showPopup" class="popup-overlay">
  <div class="popup-box" [ngClass]="messageType">
    <p>{{ message }}</p>
  </div>
</div>

<!-- DUAL DASHBOARD SELECTION MODAL -->
<div *ngIf="showSelectionModal" class="dashboard-modal-overlay">
  <div class="dashboard-modal-box">
    <h3 class="dashboard-modal-title">Select Dashboard</h3>
    <p class="dashboard-modal-message">Choose how you want to continue.</p>
    
    <div class="dashboard-options">
      <button class="dashboard-option-btn hr-mode" (click)="selectDashboard('HR')">
        <div class="option-icon-wrapper">
          <i class="fas fa-user-shield"></i>
        </div>
        <span class="option-title">Continue as HR</span>
        <i class="fas fa-chevron-right arrow-icon"></i>
      </button>
      
      <button class="dashboard-option-btn emp-mode" (click)="selectDashboard('EMPLOYEE')">
        <div class="option-icon-wrapper">
          <i class="fas fa-user"></i>
        </div>
        <span class="option-title">Continue as Employee</span>
        <i class="fas fa-chevron-right arrow-icon"></i>
      </button>
    </div>
  </div>
</div>
