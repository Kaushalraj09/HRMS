<div class="map-wrapper compact-mode">
  <div #mapContainer class="map-container"></div>

  <!-- Active Filter Badge Pill (Top-Right of Map) -->
  <div class="map-filter-indicator" *ngIf="filter !== 'ALL'">
    <span class="filter-indicator-dot" [ngClass]="getFilterColorClass()"></span>
    <span class="filter-indicator-text">{{ getFilterLabel() }}: <strong>{{ filteredLocations.length }}</strong></span>
    <button type="button" class="btn-clear-map-filter" (click)="clearFilter()" title="Show All Employees">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- Empty State Overlay when no employees match filter -->
  <div class="map-empty-overlay" *ngIf="filteredLocations.length === 0 && !loading && !error">
    <div class="map-empty-box">
      <i class="fas fa-user-slash empty-map-icon"></i>
      <p>No employees matching <strong>{{ getFilterLabel() }}</strong></p>
      <button type="button" class="btn-reset-map-filter" (click)="clearFilter()">Show All Employees</button>
    </div>
  </div>

  <!-- Loading State -->
  <div class="map-loader" *ngIf="loading && !error && allLocations.length === 0">
    <div class="spinner"></div>
    <p>Loading live map...</p>
  </div>

  <!-- Error State -->
  <div class="map-error" *ngIf="error && allLocations.length === 0">
    <div class="error-icon">⚠️</div>
    <p>{{ error }}</p>
  </div>
</div>
