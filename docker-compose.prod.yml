# ==============================================================================
# AIVAN HRMS - PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ==============================================================================

services:
  db:
    image: postgres:16.6-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d ${POSTGRES_DB:-hrms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hrms_document_storage:/app/storage/documents
      - hrms_training_storage:/app/storage/trainings
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/hrms-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx

volumes:
  postgres_data:
  hrms_document_storage:
  hrms_training_storage:
  nginx_logs:
