name: CI / Security Audit
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pytest
      - name: Dependency Vulnerability Audit
        run: pip-audit -r requirements.txt
      - name: Alembic Migration Test
        run: APP_ENV=test DATABASE_URL=sqlite:///./test.db alembic upgrade head
      - name: Run Backend Test Suite
        run: APP_ENV=test DATABASE_URL=sqlite:///./test.db JWT_SECRET_KEY=test-secret AUTO_CREATE_TABLES=false AUTO_SEED_ROLES=false AUTO_SEED_DEMO_DATA=false ENABLE_SCHEDULER=false pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: NPM Security Audit
        run: npm audit --audit-level=high
      - name: Build Angular Production Bundle
        run: npm run build
